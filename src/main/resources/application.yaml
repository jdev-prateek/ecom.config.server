spring:
  application:
    name: ecom.config.server
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/jdev-prateek/ecom-config-store
          default-label: master
          clone-on-start: true
          force-pull: true
          search-paths:
            - "{application}"


server:
  port: 8080