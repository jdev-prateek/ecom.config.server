version: "0.2"

env:
  variables:
    IMAGE_NAME: ecom-config-server
    CLUSTER_NAME: ecom-cluster
    AWS_REGION: us-east-1

phases:
  install:
    commands:
      - echo "Installing Amazon Corretto 21"
      - curl -LO https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.tar.gz
      - mkdir -p /opt/java
      - tar -xzf amazon-corretto-21-x64-linux-jdk.tar.gz -C /opt/java
      - export JAVA_HOME=$(ls -d /opt/java/amazon-corretto-21*)
      - export PATH=$JAVA_HOME/bin:$PATH
      - java -version

      - echo "Installing AWS CLI v2"
      - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      - unzip -q awscliv2.zip
      - ./aws/install --update
      - aws --version

  pre_build:
    commands:
      - echo "Login to ECR"
      - aws ecr get-login-password --region $AWS_REGION |
        docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - echo "Set image tag"
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - echo "Build Spring Boot app"
      - chmod +x mvnw
      - ./mvnw clean package -DskipTests

      - echo "Build Docker image"
      - docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - docker tag $IMAGE_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG

  post_build:
    commands:
      - echo "Push image to ECR"
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG


      - export AWS_REGION=us-east-1
      - export AWS_DEFAULT_REGION=us-east-1
      - export AWS_SDK_LOAD_CONFIG=1
      - aws eks update-kubeconfig --region $AWS_REGION --name ecom-cluster
      - kubectl get nodes

      - echo "Deploy to EKS"
      - kubectl set image deployment/ecom-config-server ecom-config-server=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG
